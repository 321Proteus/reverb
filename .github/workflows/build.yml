name: build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Read IDA versions
    runs-on: ubuntu-latest
    outputs:
      ida: ${{ steps.v.outputs.ida }}
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          echo "ida=$(jq -c '.plugin.idaVersions' ida-plugin.json)" >> "$GITHUB_OUTPUT"
          # macOS runners are expensive: only build them for the latest SDK
          matrix="$(jq -c '
            (.plugin.idaVersions | max_by(split(".") | map(tonumber))) as $latest
            | [ .plugin.idaVersions[] as $ida
                | ({runner: "ubuntu-latest",  name: "linux"},
                   {runner: "windows-latest", name: "windows"},
                   (select($ida == $latest) | {runner: "macos-latest",   name: "macos-arm64"}),
                   (select($ida == $latest) | {runner: "macos-15-intel", name: "macos-x64"}))
                  as $os
                | {ida: $ida, os: $os} ]
            | {include: .}' ida-plugin.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    name: IDA ${{ matrix.ida }} on ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Download IDA SDK ${{ matrix.ida }}
        shell: bash
        env:
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
        run: |
          v="${{ matrix.ida }}"
          uvx --from ida-hcli hcli --disable-updates \
            download "release/${v}/sdk-and-utilities/idasdk${v//./}.zip"
          unzip -q idasdk*.zip -d ./ida-temp/
          pro_h="$(find ida-temp -path '*/include/pro.h' | head -n1)"
          test -n "$pro_h" || { echo "pro.h not found in SDK"; exit 1; }
          mv "$(dirname "$(dirname "$pro_h")")" ./ida-sdk
          if [ ! -f ida-sdk/cmake/idasdk_init.cmake ]; then
            git clone --depth 1 \
              https://github.com/allthingsida/ida-cmake.git ./ida-sdk/ida-cmake
          fi

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.2.x"

      - name: Build
        shell: bash
        env:
          IDASDK: ${{ github.workspace }}/ida-sdk
          OS_NAME: ${{ matrix.os.name }}
        run: |
          generator_args=()
          if [ "$OS_NAME" = "windows" ]; then
            generator_args=(-A x64)
          fi
          cmake -B build -S . \
            "${generator_args[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build build --config Release

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find ida-sdk/bin build -type f -name '*reverb*' || true
          find ida-sdk/bin build -type f \
            \( -name '*reverb.so' -o -name '*reverb.dll' -o -name '*reverb.dylib' \) \
            -exec cp -v {} artifacts/ \; || true
          ls artifacts | grep -E 'reverb\.(so|dll|dylib)$' > /dev/null \
            || { echo "No plugin binary found"; exit 1; }
          cp -r assets artifacts/
          jq '.plugin.idaVersions = "==${{ matrix.ida }}"' ida-plugin.json > artifacts/ida-plugin.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reverb-ida${{ matrix.ida }}-${{ matrix.os.name }}
          path: artifacts/*
          if-no-files-found: error

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [versions, build]
    runs-on: macos-latest
    name: package for IDA ${{ matrix.ida }}
    strategy:
      fail-fast: false
      matrix:
        ida: ${{ fromJSON(needs.versions.outputs.ida) }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: reverb-ida${{ matrix.ida }}-*

      - name: Assemble package
        shell: bash
        run: |
          v="${{ matrix.ida }}"
          p="parts/reverb-ida${v}"
          mkdir -p pkg
          cp -R "${p}-linux/." pkg/
          cp "${p}-windows/reverb.dll" pkg/
          if [ -d "${p}-macos-arm64" ]; then
            lipo -create \
              "${p}-macos-arm64/reverb.dylib" \
              "${p}-macos-x64/reverb.dylib" \
              -output pkg/reverb.dylib
          fi
          (cd pkg && zip -r "../reverb-ida${v}.zip" .)

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-ida${{ matrix.ida }}
          path: reverb-ida${{ matrix.ida }}.zip
          if-no-files-found: error

  # One job creates the release, with every IDA version's zip: matrix jobs
  # uploading to the same tag at once can race and make duplicate releases.
  # It stays a draft: the type libraries (tools/tilgen/package.sh) are not
  # built here, they are attached by hand before it is published.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-ida*
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/reverb-ida*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Pick the zip matching your IDA version.

            The framework type libraries are `reverb-tils-<date>.tar.xz` (optional). Extract it into the `til` directory of your IDA user directory:
            `tar -xJf reverb-tils-<date>.tar.xz -C ~/.idapro/til` (Windows: `%APPDATA%\Hex-Rays\IDA Pro\til`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}